name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - name: Import every module with warnings as errors
        run: |
          cd bin
          for f in wiki_paths wiki_record wiki_symbols wiki_queue wiki_guard wiki_structure; do
            python -W error::SyntaxWarning -c "import $f" || exit 1
          done
      - run: python -m pytest tests -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests -v
